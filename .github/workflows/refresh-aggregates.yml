# Cron that refreshes the community aggregate Firestore docs.
#
# Why GitHub Actions instead of Vercel Cron: the Hobby Vercel plan only
# allows a single daily cron, and keeping this job here lets us manually
# repair/prime the aggregate without changing site code.
#
# What the webhook does: reads COMMUNITY_WINDOW_SIZE public matches from
# Firestore, writes the normalized latest window into chunked aggregate
# docs, refreshes range docs, and invalidates the `community-matches`
# cache tag. Desktop appends handle normal freshness; this is the repair
# safety net so hot page loads do not scan raw matches.
#
# See: src/app/api/community/aggregate/refresh/route.ts
#      src/lib/community/data.ts

name: Refresh community aggregate

on:
  schedule:
    # Daily. This is the SAFETY NET, not the fast path.
    # The desktop client triggers /api/community/aggregate/append after
    # each match save for near-instant freshness; this cron only exists
    # to catch edits, deletions, and anything the append path missed.
    # 1 run/day reads the latest 7,000 public matches. The 7/14/30 day
    # range caches use a one-time raw backfill, then daily chunk-level
    # merge/prune repair so they do not triple the daily read cost.
    - cron: "17 3 * * *"
  # Manual repairs are lane-scoped. This matters while a fact backfill needs
  # several invocations: advancing Sideboard must not rescan Community and
  # Mulligan on every click (and vice versa).
  workflow_dispatch:
    inputs:
      lane:
        description: Aggregate lane to repair/backfill
        required: true
        default: community
        type: choice
        options:
          - community
          - mulligan
          - sideboard
          - all
      limit:
        description: Replay documents per Mulligan/Sideboard backfill page
        required: true
        default: "1500"
        type: string
      force:
        description: Bypass the same-day unchanged-source guard
        required: true
        default: false
        type: boolean

concurrency:
  # If a previous run is still going, skip this one instead of piling up.
  group: refresh-community-aggregate
  cancel-in-progress: false

jobs:
  community:
    if: >-
      github.event_name == 'schedule' ||
      github.event.inputs.lane == 'community' ||
      github.event.inputs.lane == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Refresh community aggregate
        env:
          REFRESH_SECRET: ${{ secrets.COMMUNITY_AGGREGATE_SECRET }}
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force || 'false' }}
        run: |
          if [ -z "$REFRESH_SECRET" ]; then
            echo "::error::COMMUNITY_AGGREGATE_SECRET is not set in repo secrets"
            exit 1
          fi

          # --fail makes curl exit non-zero on 4xx/5xx so the job turns red.
          # --show-error + --silent keeps the log clean on success but still
          # prints errors. -w dumps the HTTP status for easy scanning.
          response=$(curl \
            --fail \
            --silent \
            --show-error \
            --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $REFRESH_SECRET" \
            -w "\nHTTP %{http_code} in %{time_total}s\n" \
            "https://riftlite.vercel.app/api/community/aggregate/refresh?force=$FORCE_REFRESH")

          echo "$response"

  mulligan:
    if: >-
      github.event_name == 'schedule' ||
      github.event.inputs.lane == 'mulligan' ||
      github.event.inputs.lane == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Refresh Mulligan Lab snapshot
        env:
          REFRESH_SECRET: ${{ secrets.COMMUNITY_AGGREGATE_SECRET }}
          BACKFILL_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.limit || '1500' }}
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force || 'false' }}
        run: |
          if [ -z "$REFRESH_SECRET" ]; then
            echo "::error::COMMUNITY_AGGREGATE_SECRET is not set in repo secrets"
            exit 1
          fi
          if ! [[ "$BACKFILL_LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::limit must be a positive integer"
            exit 1
          fi

          response=$(curl \
            --fail \
            --silent \
            --show-error \
            --max-time 300 \
            -X POST \
            -H "Authorization: Bearer $REFRESH_SECRET" \
            -w "\nHTTP %{http_code} in %{time_total}s\n" \
            "https://riftlite.vercel.app/api/app/mulligan-lab/refresh?limit=$BACKFILL_LIMIT&force=$FORCE_REFRESH")

          echo "$response"

  sideboard:
    if: >-
      github.event_name == 'schedule' ||
      github.event.inputs.lane == 'sideboard' ||
      github.event.inputs.lane == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Refresh Sideboard Lab snapshot
        env:
          REFRESH_SECRET: ${{ secrets.COMMUNITY_AGGREGATE_SECRET }}
          BACKFILL_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.limit || '1500' }}
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force || 'false' }}
        run: |
          if [ -z "$REFRESH_SECRET" ]; then
            echo "::error::COMMUNITY_AGGREGATE_SECRET is not set in repo secrets"
            exit 1
          fi
          if ! [[ "$BACKFILL_LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::limit must be a positive integer"
            exit 1
          fi

          response=$(curl \
            --fail \
            --silent \
            --show-error \
            --max-time 300 \
            -X POST \
            -H "Authorization: Bearer $REFRESH_SECRET" \
            -w "\nHTTP %{http_code} in %{time_total}s\n" \
            "https://riftlite.vercel.app/api/app/sideboard-lab/refresh?limit=$BACKFILL_LIMIT&force=$FORCE_REFRESH")

          echo "$response"
